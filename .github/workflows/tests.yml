name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      - name: Integration tests
        run: npm run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PORT: 3000
      DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
      SMS_MOCK: "true"
      E2E_BASE_URL: http://localhost:3000
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
      - name: Build backend
        run: npm run build
      - name: Start backend
        run: |
          node dist/main.js > server.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health/live || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "Backend did not become ready. Last HTTP code: $code"
            echo "--- server.log ---"
            cat server.log
            exit 1
          fi
          echo "Backend ready (HTTP 200)"
        env:
          PORT: 3000
          DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_TOKEN_SECRET: ci-access-secret
          JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
          SMS_MOCK: "true"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts
